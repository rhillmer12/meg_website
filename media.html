<!DOCTYPE HTML>
<html>
	<head>
		<title>Media | Meg Whyte</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<style>
			#main #media.main {
				padding: 0 !important;
				width: 100vw !important;
				max-width: 100vw !important;
				margin-left: calc(50% - 50vw) !important;
				margin-right: calc(50% - 50vw) !important;
			}
			
			#media .media-section {
				padding: 2em 5em 4em 5em;
				margin: 0;
				width: 100%;
				box-sizing: border-box;
			}
			
			#media {
				width: 100vw !important;
				max-width: 100vw !important;
			}
			
			#media .media-section:nth-child(odd) {
				background-color: #ffffff;
			}
			
			#media .media-section:nth-child(even) {
				background-color: #f4f4f4;
			}
			
			#media .section-title {
				text-align: center;
				margin-bottom: 2em;
				font-size: 2em;
				color: #636363;
				position: relative;
			}
			
			#media .section-title:after {
				content: '';
				display: block;
				width: 3.25em;
				height: 2px;
				margin: 0.7em auto 1em auto;
				border-radius: 2px;
				background-image: linear-gradient(90deg, #efa8b0, #a89cc8, #8cc9f0);
			}
			
			#media .collage {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				grid-auto-rows: 200px;
				gap: 1em;
				width: 100%;
				max-width: 100%;
				margin: 0;
			}
			
			#media .collage img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				border-radius: 0.5em;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
				transition: transform 0.3s ease;
			}
			
			#media .collage img:nth-child(1) {
				grid-column: span 2;
				grid-row: span 2;
			}
			
			#media .collage img:nth-child(2) {
				grid-column: span 2;
				grid-row: span 1;
			}
			
			#media .collage img:nth-child(3) {
				grid-column: span 1;
				grid-row: span 1;
			}
			
			#media .collage img:nth-child(4) {
				grid-column: span 1;
				grid-row: span 1;
			}
			
			#media .collage img:hover {
				transform: scale(1.05);
			}
			
			@media screen and (max-width: 980px) {
				#media .media-section {
					padding: 2em 3em 3em 3em;
				}
				
				#media .section-title {
					font-size: 1.75em;
				}
				
				#media .collage {
					grid-template-columns: repeat(3, 1fr);
					grid-auto-rows: 180px;
					gap: 0.75em;
				}
				
				#media .collage img:nth-child(1) {
					grid-column: span 2;
					grid-row: span 2;
				}
				
				#media .collage img:nth-child(2) {
					grid-column: span 1;
					grid-row: span 1;
				}
			}
			
			@media screen and (max-width: 736px) {
				#media .media-section {
					padding: 1.5em 1.5em 2em 1.5em;
				}
				
				#media .section-title {
					font-size: 1.5em;
					margin-bottom: 1.5em;
				}
				
				#media .collage {
					grid-template-columns: repeat(2, 1fr);
					grid-auto-rows: 150px;
					gap: 0.5em;
				}
				
				#media .collage img:nth-child(1),
				#media .collage img:nth-child(2) {
					grid-column: span 1;
					grid-row: span 1;
				}
			}
			
			@media screen and (max-width: 480px) {
				#media .media-section {
					padding: 1em 1em 1.5em 1em;
				}
				
				#media .section-title {
					font-size: 1.25em;
				}
				
				#media .collage {
					grid-auto-rows: 120px;
					gap: 0.4em;
				}
			}
		</style>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

			<!-- Nav -->
					<nav id="nav">
						<div class="nav-brand">Margaret Whyte</div>
						<ul>
							<li><a href="index.html">About</a></li>
							<li><a href="headshots.html">Headshots</a></li>
							<li><a href="resume.html">Resume</a></li>
							<li><a href="media.html" class="active">Media</a></li>
							<li><a href="contact.html">Contact</a></li>
						</ul>
					</nav>

				<!-- Main -->
					<div id="main">

						<!-- Media Section -->
							<section id="media" class="main">
								<!-- Elephants Section -->
								<div class="media-section">
									<h3 class="section-title">Elephants</h3>
									<div class="collage">
										<img src="images/elephant1.jpg" alt="Elephant 1" />
										<img src="images/elephant2.jpg" alt="Elephant 2" />
										<img src="images/elephant3.jpg" alt="Elephant 3" />
										<img src="images/elephant4.jpg" alt="Elephant 4" />
									</div>
								</div>

								<!-- Penguins Section -->
								<div class="media-section">
									<h3 class="section-title">Penguins</h3>
									<div class="collage">
										<img src="images/penguin1.png" alt="Penguin 1" />
										<img src="images/penguin2.jpg" alt="Penguin 2" />
										<img src="images/penguin3.jpg" alt="Penguin 3" />
										<img src="images/penguin4.jpg" alt="Penguin 4" />
									</div>
								</div>

								<!-- Sheep Section -->
								<div class="media-section">
									<h3 class="section-title">Sheep</h3>
									<div class="collage">
										<img src="images/sheep1.jpg" alt="Sheep 1" />
										<img src="images/sheep2.jpg" alt="Sheep 2" />
										<img src="images/sheep3.jpg" alt="Sheep 3" />
										<img src="images/sheep4.jpg" alt="Sheep 4" />
									</div>
								</div>

							</section>

					</div>

			</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.scrollex.min.js"></script>
			<script src="assets/js/jquery.scrolly.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

	</body>
</html>
